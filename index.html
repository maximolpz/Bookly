<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Andika:wght@400;700&family=Bitter:wght@400;700&family=Literata:wght@400;700&family=Lora:wght@400;700&family=Merriweather:wght@400;700&display=swap">
<style>
:root{--bg:#fff;--fg:#1d1d1d;--mute:#7a7a7a;--line:#e3e3e3;--acc:#8a4b2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="brown"]{--bg:#dcc08f;--fg:#3a2713;--mute:#7a5f3a;--line:#c2a373;--acc:#6e3414}
:root[data-theme="black"]{--bg:#000;--fg:#d6d3cc;--mute:#7d7a74;--line:#262626;--acc:#d8a66b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;transition:background .25s,color .25s}
button,select,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:6px;padding:.45rem .8rem;cursor:pointer}
button:hover{border-color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
header h2{flex:1;margin:0;font-size:1rem;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
#lib{flex:1;overflow:auto;padding:1.5rem 1rem;max-width:640px;width:100%;margin:0 auto}
#lib h1{font-size:2rem;font-weight:normal;margin:.2rem 0 .3rem}
#drop{border:1.5px dashed var(--mute);border-radius:8px;padding:1.6rem 1rem;text-align:center;margin:1.2rem 0;cursor:pointer}
#drop.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
#drop small{display:block;color:var(--mute);margin-top:.3rem}
.item{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.item .t{flex:1;cursor:pointer;min-width:0}
.item .t b{display:block;font-weight:normal;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{color:var(--mute);font-size:.85rem}
#err{color:var(--acc);min-height:1.3em;font-size:.9rem}
#reader{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#panel{position:absolute;right:.8rem;top:.5rem;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1rem;width:min(300px,calc(100% - 1.6rem));display:grid;gap:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#panel label{display:grid;gap:.35rem;font-size:.85rem;color:var(--mute)}
#panel select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.4rem}
#panel input[type=range]{accent-color:var(--acc);width:100%}
.themes{display:flex;gap:.6rem}
.sw{width:42px;height:42px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:12px;cursor:pointer;touch-action:pan-y}
#vp{overflow:hidden}
#book{column-fill:auto;line-height:1.65;hyphens:auto;-webkit-hyphens:auto;text-align:justify;transition:transform .25s ease}
#book p{margin:0 0 .85em}
#book h1{font-size:1.55em;line-height:1.25;font-weight:normal;margin:0 0 1em;text-align:left;break-after:avoid}
footer{display:flex;align-items:center;gap:.8rem;padding:.5rem 1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--mute)}
footer input{flex:1;accent-color:var(--acc)}
@media (prefers-reduced-motion:reduce){#book,body{transition:none}}
</style>
</head>
<body>
<header>
  <button id="back" class="hide" aria-label="Volver a la biblioteca">Biblioteca</button>
  <h2 id="ttl">Bookly</h2>
  <button id="aa" class="hide" aria-label="Ajustes de lectura" aria-expanded="false">Aa</button>
</header>

<section id="lib">
  <h1>Bookly</h1>
  <div id="drop" tabindex="0" role="button">Sube una historia o arrástrala aquí
    <small>PDF, EPUB, TXT, DOC o DOCX</small></div>
  <input id="file" type="file" accept=".pdf,.epub,.txt,.docx,.doc" multiple class="hide">
  <div id="err" role="status"></div>
  <div id="list"></div>
</section>

<section id="reader" class="hide">
  <div id="panel" class="hide">
    <label>Tamaño de letra: <span id="sz"></span>
      <input id="size" type="range" min="14" max="34" step="1"></label>
    <label>Tipografía
      <select id="font">
        <option value="serif">Georgia</option>
        <option value="palatino">Palatino</option>
        <option value="sans">Sans moderna</option>
        <option value="mono">Máquina de escribir</option>
        <option value="arial">Arial</option>
        <option value="literata">Literata</option>
        <option value="bitter">Bitter</option>
        <option value="lora">Lora</option>
        <option value="merriweather">Merriweather</option>
        <option value="alegreya">Alegreya</option>
        <option value="andika">Andika</option>
        <option value="dyslexic">OpenDyslexic</option>
      </select></label>
    <div class="themes" role="group" aria-label="Color de fondo">
      <button class="sw" data-t="white" style="background:#fff" aria-label="Blanco"></button>
      <button class="sw" data-t="brown" style="background:#dcc08f" aria-label="Marrón claro"></button>
      <button class="sw" data-t="black" style="background:#000" aria-label="Negro"></button>
    </div>
  </div>
  <div id="stage"><div id="vp"><div id="book"></div></div></div>
  <footer>
    <button id="prev" aria-label="Página anterior">‹</button>
    <input id="seek" type="range" min="1" max="1" value="1" aria-label="Ir a la página">
    <span id="pg">1 / 1</span>
    <button id="next" aria-label="Página siguiente">›</button>
  </footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const FONTS={serif:'Georgia,"Times New Roman",serif',palatino:'"Palatino Linotype",Palatino,"Book Antiqua",serif',sans:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',mono:'ui-monospace,Menlo,Consolas,monospace',arial:'Arial,Helvetica,sans-serif',literata:'Literata,Georgia,serif',bitter:'Bitter,Georgia,serif',lora:'Lora,Georgia,serif',merriweather:'Merriweather,Georgia,serif',alegreya:'Alegreya,Georgia,serif',andika:'Andika,Arial,sans-serif',dyslexic:'OpenDyslexic,"Open Dyslexic",Andika,Arial,sans-serif'};
const G=48;
let S={size:20,font:'serif',theme:matchMedia('(prefers-color-scheme: dark)').matches?'black':'white'};
let lib=[],cur=null,page=0,total=1,pos=0;

function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return null}}
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function err(m){$('#err').textContent=m||''}

/* ---------- Lectura de archivos ---------- */
const fromText=t=>t.replace(/\r/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean);

async function readPDF(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let lines=[];
  for(let i=1;i<=pdf.numPages;i++){
    const c=await (await pdf.getPage(i)).getTextContent();
    let y=null,line='';
    for(const it of c.items){
      const ny=it.transform[5];
      if(y!==null&&Math.abs(ny-y)>2){lines.push(line.trim());line=''}
      line+=it.str;y=ny;
    }
    if(line.trim())lines.push(line.trim());
  }
  lines=lines.filter(Boolean);
  const max=Math.max(...lines.map(l=>l.length),1);
  const paras=[];let acc='';
  lines.forEach(l=>{
    acc=acc?(/-$/.test(acc)?acc.slice(0,-1)+l:acc+' '+l):l;
    if(/[.!?…:»”"]$/.test(l)&&l.length<max*0.8){paras.push(acc);acc=''}
  });
  if(acc)paras.push(acc);
  return paras;
}

async function readDOCX(buf){
  const r=await mammoth.extractRawText({arrayBuffer:buf});
  return fromText(r.value);
}

async function readEPUB(buf){
  const zip=await JSZip.loadAsync(buf);
  const parse=async p=>new DOMParser().parseFromString(await zip.file(p).async('string'),'text/html');
  const cont=new DOMParser().parseFromString(await zip.file('META-INF/container.xml').async('string'),'application/xml');
  const opfPath=cont.querySelector('rootfile').getAttribute('full-path');
  const base=opfPath.includes('/')?opfPath.replace(/[^/]*$/,''):'';
  const opf=new DOMParser().parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  const manifest={};
  opf.querySelectorAll('manifest > item').forEach(i=>manifest[i.getAttribute('id')]=i.getAttribute('href'));
  const paras=[];
  for(const ref of opf.querySelectorAll('spine > itemref')){
    const href=manifest[ref.getAttribute('idref')];
    if(!href)continue;
    const f=decodeURIComponent(base+href);
    if(!zip.file(f))continue;
    const doc=await parse(f);
    doc.querySelectorAll('h1,h2,h3,h4,p').forEach(n=>{
      const t=n.textContent.replace(/\s+/g,' ').trim();
      if(t)paras.push(t);
    });
  }
  const dt=opf.querySelector('metadata > *|title,metadata title');
  return {paras,title:dt?dt.textContent.trim():''};
}

async function importFile(f){
  const name=f.name,ext=name.split('.').pop().toLowerCase();
  let title=name.replace(/\.[^.]+$/,''),paras;
  if(ext==='txt'){paras=fromText(await f.text())}
  else if(ext==='pdf'){paras=await readPDF(await f.arrayBuffer())}
  else if(ext==='docx'){paras=await readDOCX(await f.arrayBuffer())}
  else if(ext==='epub'){const r=await readEPUB(await f.arrayBuffer());paras=r.paras;if(r.title)title=r.title}
  else if(ext==='doc'){throw new Error('El formato .doc antiguo no se puede leer. Guárdalo como .docx y vuelve a subirlo.')}
  else throw new Error('Formato no compatible: .'+ext+'. Usa PDF, EPUB, TXT o DOCX.');
  if(!paras||!paras.length)throw new Error('No encontré texto en «'+name+'». Si es un PDF escaneado, no se puede leer.');
  const words=paras.join(' ').split(/\s+/).length;
  lib.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),title,paras,words,pos:0});
  if(!ls('historias',lib))err('Se abrió, pero no hay espacio para guardarla en este navegador.');
}

async function handle(files){
  err('Cargando…');
  let last=null,bad='';
  for(const f of files){
    try{await importFile(f);last=lib[0]}catch(e){bad=e.message||String(e)}
  }
  err(bad);
  drawLib();
  if(last&&!bad)openStory(last.id);
}

/* ---------- Biblioteca ---------- */
function drawLib(){
  const l=$('#list');
  if(!lib.length){l.innerHTML='<p style="color:var(--mute)">Todavía no hay historias. Sube la primera.</p>';return}
  l.innerHTML=lib.map(s=>`<div class="item"><div class="t" data-o="${s.id}" tabindex="0" role="button"><b>${esc(s.title)}</b><span>${s.words.toLocaleString('es')} palabras · leído ${Math.round(s.pos*100)}%</span></div><button data-d="${s.id}" aria-label="Eliminar ${esc(s.title)}">Eliminar</button></div>`).join('');
}
$('#list').addEventListener('click',e=>{
  const o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');
  if(o)openStory(o.dataset.o);
  if(d&&confirm('¿Eliminar esta historia de la biblioteca?')){lib=lib.filter(s=>s.id!==d.dataset.d);ls('historias',lib);drawLib()}
});
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.o)openStory(e.target.dataset.o)});
const drop=$('#drop'),fi=$('#file');
drop.onclick=()=>fi.click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};
fi.onchange=()=>{handle([...fi.files]);fi.value=''};
['dragover','dragenter'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>handle([...e.dataTransfer.files]));

/* ---------- Lector ---------- */
function openStory(id){
  cur=lib.find(s=>s.id===id);if(!cur)return;
  $('#lib').classList.add('hide');$('#reader').classList.remove('hide');
  $('#back').classList.remove('hide');$('#aa').classList.remove('hide');
  $('#ttl').textContent=cur.title;
  $('#book').innerHTML='<h1>'+esc(cur.title)+'</h1>'+cur.paras.map(p=>'<p>'+esc(p)+'</p>').join('');
  pos=cur.pos||0;
  layout();
}
function closeStory(){
  $('#reader').classList.add('hide');$('#lib').classList.remove('hide');
  $('#back').classList.add('hide');$('#aa').classList.add('hide');$('#panel').classList.add('hide');
  $('#ttl').textContent='Bookly';cur=null;drawLib();
}
$('#back').onclick=closeStory;

function layout(){
  if(!cur)return;
  const st=$('#stage'),b=$('#book'),vp=$('#vp');
  const W=Math.min(680,st.clientWidth-24),H=st.clientHeight-24;
  vp.style.width=W+'px';vp.style.height=H+'px';
  b.style.cssText=`width:${W}px;height:${H}px;column-width:${W}px;column-gap:${G}px;font-size:${S.size}px;font-family:${FONTS[S.font]}`;
  b.style.transform='none';
  total=Math.max(1,Math.round((b.scrollWidth+G)/(W+G)));
  page=Math.min(total-1,Math.floor(pos*total+0.001));
  show();
}
function show(){
  const W=$('#vp').clientWidth;
  $('#book').style.transform=`translateX(${-page*(W+G)}px)`;
  $('#pg').textContent=(page+1)+' / '+total;
  const sk=$('#seek');sk.max=total;sk.value=page+1;
  pos=total>1?page/total:0;
  if(cur){cur.pos=total>1?(page+1)/total:1;ls('historias',lib)}
  if(cur)cur.start=pos;
}
function go(n){page=Math.max(0,Math.min(total-1,n));show()}
$('#prev').onclick=e=>{e.stopPropagation();go(page-1)};
$('#next').onclick=e=>{e.stopPropagation();go(page+1)};
$('#seek').oninput=e=>go(+e.target.value-1);
$('#stage').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  $('#panel').classList.add('hide');$('#aa').setAttribute('aria-expanded','false');
  if(x<.33)go(page-1);else if(x>.67)go(page+1);
});
let tx=null;
$('#stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{
  if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(d)>50){e.preventDefault();go(page+(d<0?1:-1))}
});
addEventListener('keydown',e=>{
  if(!cur||e.target.matches('select'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(page+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(page-1)}
});
addEventListener('resize',layout);

/* ---------- Ajustes ---------- */
$('#aa').onclick=()=>{
  const p=$('#panel'),h=p.classList.toggle('hide');
  $('#aa').setAttribute('aria-expanded',String(!h));
};
function applySettings(){
  document.documentElement.dataset.theme=S.theme;
  $('#size').value=S.size;$('#sz').textContent=S.size+' px';$('#font').value=S.font;
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===S.theme)));
  ls('ajustes',S);
}
$('#size').oninput=e=>{S.size=+e.target.value;applySettings();layout()};
$('#font').onchange=e=>{S.font=e.target.value;applySettings();layout()};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;applySettings()});

/* ---------- Inicio ---------- */
(function(){
  const a=ls('ajustes');if(a)Object.assign(S,a);
  const l=ls('historias');if(Array.isArray(l))lib=l;
  applySettings();drawLib();
})();
</script>
</body>
</html>
